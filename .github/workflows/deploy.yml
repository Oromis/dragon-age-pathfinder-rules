name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
  workflow_dispatch:
  repository_dispatch:
    types: [ notes-updated ]
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - name: Checkout notes repo
        uses: actions/checkout@v4
        with:
          repository: Oromis/Obsidian-PnP
          token: ${{ secrets.NOTES_REPO_TOKEN }}
          path: notes
      - name: Copy Rules folder
        run: |
          rm -rf content
          mkdir -p content
          cp -R "notes/Dragon Age/Rules" content/Rules
          cp -R "notes/Dragon Age/Bilder" content/Bilder
          cp -R "notes/Dragon Age/index.md" content/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
